name: Lua Pull Request CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  attestations: read
  actions: read
  security-events: write
concurrency:
  group: lua-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/lua-checks.yml
    with:
      tier: pr


  timings:
    name: Lua pr timings
    if: always()
    needs: [checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/ci_timings.py --scope lua --output build/timings.json
      - uses: actions/upload-artifact@v4
        with:
          name: lua-pr-timings-${{ github.run_attempt }}
          path: build/timings.json
          if-no-files-found: error
