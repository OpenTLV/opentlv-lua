name: Lua build matrix
on:
  workflow_call:
    inputs:
      tier:
        type: string
        required: true
      release_tag:
        type: string
        default: ''
permissions:
  contents: read
  attestations: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: matrix
        env:
          TIER: ${{ inputs.tier }}
        run: python -B scripts/release.py matrix --tier "$TIER"
  test:
    needs: inventory
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      LUA_JOB_ID: ${{ matrix.id }}
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Linux compiler tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang-18 ninja-build
      - name: Select sanitizer compiler
        if: matrix.sanitizer
        run: echo 'CC=clang-18' >> "$GITHUB_ENV"
      - name: Set local candidate version
        if: inputs.release_tag != ''
        shell: python
        run: |
          import os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)', tag)
          subprocess.run(['git', 'tag', tag, os.environ['GITHUB_SHA']], check=True)
      # gh-actions-lua builds Lua with cl on Windows, which needs the MSVC
      # environment.
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Lua
        # v11 links the Windows interpreter to the same DLL as native rocks.
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: ${{ matrix.lua == 'luajit' && 'luajit-2.1' || matrix.lua }}
          # v10 and v11 share cache keys; avoid restoring a statically linked
          # Windows interpreter left by the old action.
          buildCache: ${{ runner.os != 'Windows' }}

      - name: Set up LuaRocks
        if: runner.os != 'Windows'
        uses: leafo/gh-actions-luarocks@v4

      - name: Run LuaRocks with PUC Lua for LuaJIT
        if: matrix.lua == 'luajit'
        shell: bash
        run: |
          # LuaJIT cannot compile the public manifest (>65536 constants).
          # Change only the package manager's interpreter; its configured Lua
          # executable, headers and generated Busted launcher remain LuaJIT.
          sudo apt-get install -y lua5.1
          python - <<'PY'
          from pathlib import Path
          launcher = Path('.luarocks/bin/luarocks')
          first, body = launcher.read_text().split('\n', 1)
          assert first.startswith('#!'), 'Expected a LuaRocks interpreter shebang'
          launcher.write_text('#!/usr/bin/lua5.1\n' + body)
          PY
          test "$(luarocks config variables.LUA)" = "$GITHUB_WORKSPACE/.lua/bin/luajit"

      # gh-actions-luarocks invokes POSIX configure/make, including on Windows.
      - name: Set up LuaRocks on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LUA_VERSION: ${{ matrix.lua }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rocksVersion = '3.11.1'
          $archive = Join-Path $env:RUNNER_TEMP 'luarocks.zip'
          $toolsDir = Join-Path $env:RUNNER_TEMP 'luarocks'
          Invoke-WebRequest "https://luarocks.org/releases/luarocks-$rocksVersion-windows-64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $toolsDir
          $rocksBin = Join-Path $toolsDir "luarocks-$rocksVersion-windows-64"
          $rocks = Join-Path $rocksBin 'luarocks.exe'
          $luaPrefix = (Join-Path $env:GITHUB_WORKSPACE '.lua').Replace('\', '/')
          $tree = (Join-Path $env:RUNNER_TEMP 'lua-rocks').Replace('\', '/')
          $abi = $env:LUA_VERSION.Replace('.', '')
          $env:LUAROCKS_CONFIG = Join-Path $env:RUNNER_TEMP 'luarocks-config.lua'
          # Select MSVC explicitly: the standalone executable defaults to MinGW.
          $config = @"
          lua_version = "$env:LUA_VERSION"
          lua_interpreter = "lua.exe"
          platforms = { "windows", "win32" }
          rocks_trees = { [[$tree]] }
          variables = {
            LUA = [[$luaPrefix/bin/lua.exe]],
            LUA_DIR = [[$luaPrefix]],
            LUA_BINDIR = [[$luaPrefix/bin]],
            LUA_INCDIR = [[$luaPrefix/include]],
            LUA_LIBDIR = [[$luaPrefix/lib]],
            LUALIB = "lua$abi.lib",
          }
          "@
          [IO.File]::WriteAllText($env:LUAROCKS_CONFIG, $config, [Text.UTF8Encoding]::new($false))
          "LUAROCKS_CONFIG=$env:LUAROCKS_CONFIG" >> $env:GITHUB_ENV
          # Use the same single-configuration output layout as the original workflow.
          'CMAKE_GENERATOR=Ninja' >> $env:GITHUB_ENV
          $rocksBin >> $env:GITHUB_PATH
          "$tree/bin" >> $env:GITHUB_PATH
          $luaPath = & $rocks path --lr-path
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve LuaRocks Lua path' }
          $luaCPath = & $rocks path --lr-cpath
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve LuaRocks native module path' }
          "LUA_PATH=$luaPath;;" >> $env:GITHUB_ENV
          "LUA_CPATH=$luaCPath;;" >> $env:GITHUB_ENV
          & $rocks --version
          if ($LASTEXITCODE -ne 0) { throw 'LuaRocks installation failed' }

      - name: Install test dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Dependency rockspecs can fetch archives outside the LuaRocks server.
          # Retry transient download failures while retaining a failing final status.
          for attempt in 1 2 3; do
            if luarocks install busted; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Test dependency installation failed (attempt $attempt/3); retrying in 5 seconds."
              sleep 5
            fi
          done
          echo "::error::Test dependency installation failed after 3 attempts."
          exit 1

      # Git Bash prepends its Unix tools to PATH and shadows MSVC's link.exe.
      - name: Install test dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            luarocks install busted
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Output "::warning::Test dependency installation failed (attempt $attempt/3); retrying in 5 seconds."
              Start-Sleep -Seconds 5
            }
          }
          Write-Output '::error::Test dependency installation failed after 3 attempts.'
          exit 1

      - name: Lua build, public API, corpus and packaging
        env:
          LUA_RUNTIME: ${{ matrix.lua }}
          CORE_SHARED: ${{ matrix.shared }}
          CONFIGURATION: ${{ matrix.configuration }}
          SANITIZER: ${{ matrix.sanitizer }}
          ROCKS: ${{ matrix.rocks }}
          PACKAGE: ${{ matrix.package }}
        shell: python
        run: |
          import os, subprocess, sys
          args = [sys.executable, '-B', 'scripts/ci.py', '--lua-prefix', '.lua',
                  '--runtime', os.environ['LUA_RUNTIME'], '--shared', os.environ['CORE_SHARED'],
                  '--configuration', os.environ['CONFIGURATION'], '--output', 'build/record.json']
          for key, flag in [('SANITIZER', '--sanitizer'), ('ROCKS', '--rocks')]:
              if os.environ[key] == 'true': args.append(flag)
          if os.environ['PACKAGE']: args.extend(['--package', os.environ['PACKAGE']])
          if os.environ['RELEASE_TAG']: args.append('--release')
          subprocess.run(args, check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lua-build-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            build/record.json
            build/packages/*.zip
          if-no-files-found: error
