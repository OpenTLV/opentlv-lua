name: Lua Release Gate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag, e.g. v0.2.0; changelog must be closed
        required: true
        type: string
permissions:
  contents: read
  attestations: read
concurrency:
  group: lua-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -B scripts/release.py prepare --output build/request.json
      - uses: actions/upload-artifact@v4
        with:
          name: lua-request-${{ github.run_attempt }}
          path: build/request.json
          if-no-files-found: error
  full-ci:
    needs: prepare
    permissions:
      contents: read
      attestations: read
      actions: read
      security-events: write
    uses: ./.github/workflows/lua-full.yml
    with:
      release_tag: ${{ inputs.tag }}
  assemble:
    name: Assemble and attest Lua release
    needs: [prepare, full-ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: lua-request-${{ github.run_attempt }}
          path: build/evidence
      - uses: actions/download-artifact@v4
        with:
          name: lua-quality-full-${{ github.run_attempt }}
          path: build/evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: lua-build-*-${{ github.run_attempt }}
          path: build/evidence/builds
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/release.py assemble
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: build/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: lua-release-${{ github.run_attempt }}
          path: build/release/*
          if-no-files-found: error
  publish:
    needs: [full-ci, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: lua-release-${{ github.run_attempt }}
          path: build/release
      - env:
          GH_TOKEN: ${{ github.token }}
          FULL_CI_RESULT: ${{ needs.full-ci.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
        run: python -B scripts/release.py publish

  timings:
    name: Lua release timings
    if: always()
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/ci_timings.py --scope run --output build/timings.json
      - uses: actions/upload-artifact@v4
        with:
          name: lua-release-timings-${{ github.run_attempt }}
          path: build/timings.json
          if-no-files-found: error
