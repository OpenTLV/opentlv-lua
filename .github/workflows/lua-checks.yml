name: Lua checks
on:
  workflow_call:
    inputs:
      tier:
        type: string
        required: true
      release_tag:
        type: string
        default: ''
permissions:
  contents: read
  attestations: read
  actions: read
  security-events: write
jobs:
  build:
    uses: ./.github/workflows/lua.yml
    with:
      tier: ${{ inputs.tier }}
      release_tag: ${{ inputs.release_tag }}
  quality:
    uses: ./.github/workflows/quality.yml
  codeql:
    uses: ./.github/workflows/lua-codeql.yml
  api_coverage:
    name: Core API coverage
    # Fails when a generic Core symbol is neither bound nor a reviewed exclusion (#31).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The base revision supplies the previous Core pin for pull requests.
          fetch-depth: 0
          persist-credentials: false
      - name: Report pinned Core API coverage
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          coverage_command=(python -B scripts/api_coverage.py --output build/api-coverage.json
            --summary "$GITHUB_STEP_SUMMARY")
          if [[ -n "$BASE_SHA" ]]; then coverage_command+=(--base "$BASE_SHA"); fi
          "${coverage_command[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lua-api-coverage-${{ inputs.tier }}-${{ github.run_attempt }}
          path: build/api-coverage.json
          if-no-files-found: error
  gate:
    name: Lua quality gate
    if: always()
    needs: [build, quality, codeql, api_coverage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: lua-build-*-${{ github.run_attempt }}
          path: build/evidence
      - env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          TIER: ${{ inputs.tier }}
        run: python -B scripts/release.py gate --tier "$TIER" --output build/quality.json
      - uses: actions/upload-artifact@v4
        with:
          name: lua-quality-${{ inputs.tier }}-${{ github.run_attempt }}
          path: build/quality.json
          if-no-files-found: error
