name: Lua source quality
on:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y clang-18 clang-tidy-18 cppcheck ninja-build lua5.1 liblua5.4-dev
      - run: python -m pip install -r requirements-dev.txt
      - name: Formatting and tooling regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/quality
          pre-commit run --all-files 2>&1 | tee build/quality/pre-commit.log
          python -B -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee build/quality/tests.log
          find lua tests examples -name '*.lua' -exec luac5.1 -p '{}' +
      - name: Configure Lua compilation database
        run: >-
          cmake -S . -B build/quality/compile -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DOPENTLV_BUILD_LUA_TESTS=OFF
          -DLUA_INCLUDE_DIR=/usr/include/lua5.4 -DFETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER
      - name: clang-tidy
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/check_static.py --build build/quality/compile --tool clang-tidy 2>&1 | tee build/quality/clang-tidy.log
      - name: cppcheck
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/check_static.py --build build/quality/compile --tool cppcheck 2>&1 | tee build/quality/cppcheck.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lua-static-${{ github.run_attempt }}
          path: build/quality/*.log
          if-no-files-found: error
